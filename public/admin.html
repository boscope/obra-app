<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Calculadora de Obra</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f0ea;color:#2c3e50}
  header{background:linear-gradient(135deg,#1f2c3a,#2c3e50);color:#fff;padding:16px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:1.2rem}
  header a{color:#ffd9a8;text-decoration:none;font-size:.85rem}
  header .end{margin-left:auto;display:flex;align-items:center;gap:12px}
  main{max-width:1000px;margin:0 auto;padding:22px}
  section{background:#fff;border:1px solid #e3ddd3;border-radius:12px;padding:18px;margin-bottom:20px}
  section h2{font-size:1rem;color:#b85c0e;text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  label{font-size:.8rem;color:#7f8c8d;display:block;margin-bottom:4px}
  input,select{width:100%;padding:9px 10px;border:1px solid #cfc7ba;border-radius:8px;font-size:.95rem}
  input:focus,select:focus{outline:2px solid #e67e22}
  button{background:#e67e22;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:12px}
  button:hover{background:#b85c0e}
  button.sm{padding:6px 12px;margin:0;font-size:.8rem}
  button.pause{background:#f39c12}
  button.pause:hover{background:#d68910}
  button.activate{background:#27ae60}
  button.activate:hover{background:#1e8449}
  button.del{background:#e74c3c}
  button.del:hover{background:#c0392b}
  table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
  th,td{padding:9px 10px;border-bottom:1px solid #e3ddd3;text-align:left;vertical-align:middle}
  th{color:#7f8c8d;font-size:.75rem;text-transform:uppercase;letter-spacing:.3px}
  .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:700}
  .ativo{background:#eaf6ee;color:#27ae60}
  .pausado{background:#fdecea;color:#c0392b}
  .admin{background:#fff8ef;color:#b85c0e}
  .msg{background:#eaf6ee;color:#1e8449;border:1px solid #b6e3c4;border-radius:8px;padding:9px 12px;font-size:.85rem;margin-top:12px;display:none}
  .err{background:#fdecea;color:#c0392b;border:1px solid #f5c6c0;border-radius:8px;padding:9px 12px;font-size:.85rem;margin-top:12px;display:none}
  .sub{font-size:.8rem;color:#7f8c8d;margin-top:8px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-wrap table{min-width:640px}
  @media(max-width:760px){
    input,select{font-size:16px;min-height:46px}
    button{min-height:46px;font-size:1rem}
    .grid{grid-template-columns:1fr 1fr}
    header{padding:14px 16px}
    main{padding:14px}
  }
</style>
</head>
<body>
<header>
  <h1>⚙️ Painel Admin</h1>
  <a href="/">Abrir calculadora</a>
  <div class="end">
    <span id="whoAmI"></span>
    <button id="btnLogout" style="background:transparent;border:1px solid #6b5b45;color:#e8c39e;padding:5px 12px;margin:0">Sair</button>
  </div>
</header>
<main>
  <section>
    <h2>Novo acesso (cliente)</h2>
    <div class="grid">
      <div><label>Nome</label><input type="text" id="fName" placeholder="Ex.: João da Silva"></div>
      <div><label>Usuário (login)</label><input type="text" id="fUsername" placeholder="Ex.: joaosilva"></div>
      <div><label>Senha</label><input type="password" id="fPass" placeholder="Mín. 4 caracteres"></div>
      <div><label>Papel</label><select id="fRole"><option value="cliente">Cliente (assinante)</option><option value="admin">Administrador</option></select></div>
    </div>
    <button id="btnCreate">Criar acesso</button>
    <div class="msg" id="msg"></div>
    <div class="err" id="err"></div>
  </section>

  <section>
    <h2>Alterar minha senha</h2>
    <div class="grid g3">
      <div><label>Senha atual</label><input type="password" id="crPass" autocomplete="current-password"></div>
      <div><label>Nova senha</label><input type="password" id="nwPass" autocomplete="new-password"></div>
      <div><label>Confirmar nova senha</label><input type="password" id="cfPass" autocomplete="new-password"></div>
    </div>
    <button id="btnPass">Salvar nova senha</button>
    <div class="msg" id="passMsg"></div>
    <div class="err" id="passErr"></div>
  </section>

  <section>
    <h2>Usuários cadastrados</h2>
    <p class="sub">Pausar = bloqueia o acesso de quem não pagou. Excluir = remove a conta definitivamente.</p>
    <div class="table-wrap"><table>
      <thead>
        <tr><th>Nome</th><th>Login</th><th>Papel</th><th>Situação</th><th>Criado em</th><th>Ações</th></tr>
      </thead>
      <tbody id="tBody"></tbody>
    </table></div>
  </section>
</main>
<script>
let meId = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erro de comunicação.');
  return data;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function load() {
  const data = await api('/api/admin/users');
  const tbody = document.getElementById('tBody');
  tbody.innerHTML = data.users.map(u => {
    const isMe = u.id === meId;
    const statusPill = u.status === 'ativo' ? '<span class="pill ativo">Ativo</span>' : '<span class="pill pausado">Pausado</span>';
    const rolePill = u.role === 'admin' ? '<span class="pill admin">Admin</span>' : 'Cliente';
    const btnStatus = u.status === 'ativo'
      ? `<button class="sm pause" data-act="status" data-id="${u.id}">⏸ Pausar</button>`
      : `<button class="sm activate" data-act="status" data-id="${u.id}">▶ Ativar</button>`;
    const btnDel = isMe ? '' : `<button class="sm del" data-act="del" data-id="${u.id}">✕ Excluir</button>`;
    return `<tr>
      <td>${escapeHtml(u.name)}${isMe ? ' <em>(você)</em>' : ''}</td>
      <td>${escapeHtml(u.username)}</td>
      <td>${rolePill}</td>
      <td>${statusPill}</td>
      <td>${escapeHtml(u.created_at || '')}</td>
      <td>${u.status === 'pausado' ? btnStatus : (isMe ? btnStatus : btnStatus + btnDel)}</td>
    </tr>`;
  }).join('');
}

async function init() {
  document.getElementById('whoAmI').textContent = '👷 ' + (await api('/api/me')).user?.name || '';
  meId = (await api('/api/me')).user?.id;
  await load();
}

document.getElementById('btnPass').addEventListener('click', async () => {
  const msg = document.getElementById('passMsg');
  const err = document.getElementById('passErr');
  msg.style.display = 'none'; err.style.display = 'none';
  const current = document.getElementById('crPass').value;
  const next = document.getElementById('nwPass').value;
  const confirm = document.getElementById('cfPass').value;
  if (next !== confirm) { err.textContent = 'A confirmação da nova senha não confere.'; err.style.display = 'block'; return; }
  try {
    await api('/api/admin/me/password', { method: 'POST', body: JSON.stringify({ current, next }) });
    msg.textContent = 'Senha alterada com sucesso.';
    msg.style.display = 'block';
    document.getElementById('crPass').value = '';
    document.getElementById('nwPass').value = '';
    document.getElementById('cfPass').value = '';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
});

document.getElementById('btnCreate').addEventListener('click', async () => {
  const msg = document.getElementById('msg');
  const err = document.getElementById('err');
  msg.style.display = 'none'; err.style.display = 'none';
  try {
    await api('/api/admin/users', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('fName').value,
        username: document.getElementById('fUsername').value,
        password: document.getElementById('fPass').value,
        role: document.getElementById('fRole').value
      })
    });
    msg.textContent = 'Acesso criado com sucesso.';
    msg.style.display = 'block';
    document.getElementById('fName').value = '';
    document.getElementById('fUsername').value = '';
    document.getElementById('fPass').value = '';
    await load();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
});

document.getElementById('tBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  const err = document.getElementById('err');
  err.style.display = 'none';
  if (act === 'status') {
    await api(`/api/admin/users/${id}/status`, { method: 'POST', body: JSON.stringify({ status: btn.classList.contains('pause') ? 'pausado' : 'ativo' }) });
  } else if (act === 'del') {
    const row = btn.closest('tr');
    const name = row.cells[0].textContent;
    if (!confirm(`Excluir o acesso de "${name}"? Essa ação remove o usuário definitivamente.`)) return;
    await api(`/api/admin/users/${id}`, { method: 'DELETE' });
  }
  await load();
});

document.getElementById('btnLogout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login';
});

init().catch(e => { document.getElementById('err').textContent = e.message; document.getElementById('err').style.display = 'block'; });
</script>
</body>
</html>
